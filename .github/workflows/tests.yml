name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[classification,s3,dev]'
      - run: python -m pytest -q
      - run: python -m ruff check src/trajectory_classifier src/trajectory_curator/coverage.py tests/classification examples/classification src/trajectory_os tests/os examples/os
      - run: python -m build
